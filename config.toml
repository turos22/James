[servidor]
bind_loopback = "127.0.0.1:8080"
bind_vpn_porta = 8443
cert_arquivo = "certs/tailscale.crt"
chave_arquivo = "certs/tailscale.key"

[agente]
# Quem responde: "anthropic" (padrão do código) ou "gemini". Fica "gemini"
# aqui até a Task 6 do plano da voz em tempo real ligar o provedor Anthropic
# no jamesd; depois vira "anthropic" com modelo "claude-haiku-5-5".
provedor = "gemini"
# Conferir a lista vigente de modelos Gemini antes de trocar. Proibido:
# gemini-2.5-flash-lite (mais fraco da família).
modelo = "gemini-2.5-flash"
max_iteracoes = 5
timeout_segundos = 30

[memoria]
orcamento_tokens = 8000
# Orçamento separado do da conversa: nota nenhuma deve sumir porque o
# histórico ficou grande, e conversa nenhuma deve encolher porque a memória
# cresceu.
orcamento_notas = 2000
# Teto do resumo rolante da sessão. Sem teto, o resumo cresce a cada rodada
# e passa a comer a janela de conversa que ele deveria proteger.
orcamento_resumo = 1000
diretorio_memoria = "Vault/Memoria"

[permissao]
timeout_aprovacao_segundos = 300

[voz]
# Voz multilingual: fala português mantendo o timbre de origem. Escolhida
# ouvindo as amostras — a única pt-BR masculina do edge-tts (AntonioNeural)
# tem timbre mais claro e cadência mais rápida. Trocar aqui é a única
# mudança necessária; o Sintetizador só repassa a string pro edge-tts.
voz_tts = "en-US-AndrewMultilingualNeural"

# Quem sintetiza a resposta do turno de texto: "piper" (local, padrão do
# código) ou "edge". O jamesd só passa a usar o Piper na Task 9; até lá o
# motor é o edge. tts_url é o servidor de TTS local do Piper e só aceita
# loopback (o texto das respostas pode ter dado pessoal).
motor = "edge"
tts_url = "http://127.0.0.1:8180"

[ferramentas.terminal]
# Comando que passar disso é morto e reportado como timeout.
timeout_segundos = 60
# Teto por corrente (stdout e stderr). Truncagem sempre marcada no texto.
max_bytes_saida = 65536

[ferramentas.claude_code]
# Obrigatório para usar perguntar_ao_claude_code. Sem default de propósito:
# o cwd herdado do jamesd é a raiz do repo do próprio James.
diretorio = "C:\\Users\\Arthur\\SI\\Projetos\\james-workspace"
timeout_segundos = 600

[ferramentas.busca]
timeout_segundos = 20
max_resultados = 5

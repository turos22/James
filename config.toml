[servidor]
bind_loopback = "127.0.0.1:8080"
bind_vpn_porta = 8443
cert_arquivo = "certs/tailscale.crt"
chave_arquivo = "certs/tailscale.key"

[agente]
# Conferir a lista vigente de modelos Gemini antes de trocar. Proibido:
# gemini-2.5-flash-lite (mais fraco da família).
modelo = "gemini-2.5-flash"
max_iteracoes = 5
timeout_segundos = 30

[memoria]
orcamento_tokens = 8000

[permissao]
timeout_aprovacao_segundos = 300

[voz]
voz_tts = "pt-BR-AntonioNeural"

[ferramentas.terminal]
# Comando que passar disso é morto e reportado como timeout.
timeout_segundos = 60
# Teto por corrente (stdout e stderr). Truncagem sempre marcada no texto.
max_bytes_saida = 65536

[ferramentas.claude_code]
# Obrigatório para usar perguntar_ao_claude_code. Sem default de propósito:
# o cwd herdado do jamesd é a raiz do repo do próprio James.
diretorio = "C:\\Users\\Arthur\\SI\\Projetos\\james-workspace"
timeout_segundos = 600

[ferramentas.busca]
timeout_segundos = 20
max_resultados = 5

[project]
name = "james-device"
version = "0.1.0"
description = "Agente de dispositivo do James: voz e controle de tela"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]

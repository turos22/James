[project]
name = "james-device"
version = "0.1.0"
description = "Agente de dispositivo do James: voz e controle de tela"
requires-python = ">=3.11"
# playsound fixado em <1.3.0: o sdist do 1.3.0 tem um setup.py quebrado que
# falha "OSError: could not get source code" ao ser instalado com build
# isolation no Python 3.13 (inspect.getsource não acha o arquivo fonte
# quando o setup.py é exec'd num namespace isolado) — bug conhecido do
# pacote, não do ambiente. 1.2.2 (já instalado globalmente) expõe a mesma
# API usada aqui (playsound.playsound(caminho)).
dependencies = ["websockets>=13.0", "pyautogui>=0.9.54", "SpeechRecognition>=3.10", "playsound>=1.2.2,<1.3.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[project]
name = "james-device"
version = "0.1.0"
description = "Agente de dispositivo do James: voz e controle de tela"
requires-python = ">=3.11"
# playsound fixado em <1.3.0: o sdist do 1.3.0 tem um setup.py quebrado que
# falha "OSError: could not get source code" ao ser instalado com build
# isolation no Python 3.13 (inspect.getsource não acha o arquivo fonte
# quando o setup.py é exec'd num namespace isolado) — bug conhecido do
# pacote, não do ambiente. 1.2.2 (já instalado globalmente) expõe a mesma
# API usada aqui (playsound.playsound(caminho)).
# pyautogui, playsound e uiautomation só existem no Windows. No Linux os sons
# saem pelo pw-play (james_device/plataforma/linux.py) e controle de tela é a
# fatia B2 (spec 2026-10-09-james-fedora), então não são dependência lá.
# piper-tts: voz local do James (spec 2026-10-10 voz em tempo real). pysilero-vad
# detecta fim de fala; é o VAD Silero em ONNX e NÃO depende de nada. Não trocar
# pelo pacote oficial silero-vad: ele puxa PyTorch e CUDA (gigabytes). requests
# fala com o whisper-server e o servidor de TTS locais.
# vosk + PyAudio: wake word offline em stream contínuo (escuta.py). O modelo
# em si NÃO é dependência de pacote — é baixado à parte e vive em
# vosk/vosk-model-small-pt-0.3 na raiz do repo, fora do versionamento.
# PyAudio vira dependência direta aqui porque main.py abre o stream sozinho,
# em vez de passar pelo sr.Microphone do SpeechRecognition.
dependencies = ["websockets>=13.0", "SpeechRecognition>=3.10", "pyautogui>=0.9.54; sys_platform == 'win32'", "playsound>=1.2.2,<1.3.0; sys_platform == 'win32'", "uiautomation>=2.0.18; sys_platform == 'win32'", "vosk>=0.3.45", "PyAudio>=0.2.14", "piper-tts>=1.8", "pysilero-vad>=3.4", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# Sem isso, a descoberta automática de pacotes do setuptools vê assets/
# (áudios estáticos, Task 22) e james_device/ como dois pacotes de topo
# concorrentes e recusa o build ("Multiple top-level packages discovered
# in a flat-layout") — achado ao rodar pip install -e do zero (o install
# editable anterior nunca tinha sido refeito depois que assets/ passou a
# existir, então isso ficou escondido).
[tool.setuptools.packages.find]
include = ["james_device*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

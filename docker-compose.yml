services:
  postgres:
    image: postgres:17-alpine
    container_name: james-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: james
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: james
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - james_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U james -d james"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  james_pgdata:
